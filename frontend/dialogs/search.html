  <!-- Modal: Suche in den Unterlagen (Lupe in der Kopfzeile) -->
  <div id="modal-search" class="modal-backdrop" style="display: none;">
    <div class="modal-box search-box">
      <div class="modal-header">
        <h3>Suchen in deinen Unterlagen</h3>
        <button class="modal-close" id="btn-close-search-modal" title="Schließen"><span class="ui-icon i-schliessen" aria-hidden="true"></span></button>
      </div>
      <div class="modal-body">
        <input type="search" id="input-search" class="input-field search-input" placeholder="Wonach suchst du? Z. B. Dreisatz, Fotosynthese …" autocomplete="off" enterkeyhint="search">
        <p id="search-status" class="search-status"></p>
        <ul id="search-results" class="search-results"></ul>
      </div>
    </div>
  </div>
