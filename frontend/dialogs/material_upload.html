  <!-- Modal: Material hochladen (2-Stufen Human-in-the-Loop) -->
  <div id="modal-material" class="modal-backdrop" style="display: none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-material-title">📄 Dokument hinzufügen</h3>
        <button class="modal-close" id="btn-close-material-modal">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Stufe 1: Upload & Dateiwahl -->
        <div id="mat-step-upload">
          <p class="subtitle" id="mat-modal-subtitle" style="margin-bottom: 16px;">
            Lade ein Schulbuch, ein Arbeitsblatt, eine Mitschrift oder einen Test hoch.
          </p>
          <div class="mat-dropzone" id="mat-dropzone">
            <span class="mat-dropzone-icon">📥</span>
            <div class="mat-dropzone-text" id="mat-dropzone-text">Datei hierher ziehen oder tippen</div>
            <div class="mat-dropzone-sub" id="mat-dropzone-sub">PDF oder Foto (Mehrfachauswahl möglich)</div>
            <input type="file" id="mat-file-input" accept="application/pdf,image/*" style="display: none;" multiple>
            <button type="button" class="btn-secondary-sm" id="btn-trigger-file" style="margin-top: 10px;">📎 Datei(en) auswählen</button>
          </div>
          <div id="mat-upload-spinner" style="display: none; text-align: center; padding: 24px;">
            <div class="mat-spinner"></div>
            <p id="mat-spinner-text" style="margin-top: 12px; color: var(--accent-light); font-weight: 600;">Analysiere Dokument...</p>
            <div id="mat-batch-progress-bar" style="display: none; width: 100%; max-width: 340px; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; margin: 14px auto 6px; overflow: hidden;">
              <div id="mat-batch-progress-fill" style="width: 0%; height: 100%; background: var(--accent); transition: width 0.2s ease;"></div>
            </div>
            <p id="mat-batch-status" style="font-size: 0.85rem; color: var(--text-secondary); margin: 0;"></p>
          </div>
        </div>

        <!-- Stufe 2: Human-in-the-Loop Bestätigungsdialog -->
        <div id="mat-step-confirm" style="display: none;">
          <div class="mat-preview-card" id="mat-preview-card">
            <div class="mat-preview-header">
              <span id="mat-preview-icon" style="font-size: 1.6rem;">📄</span>
              <div style="flex: 1; overflow: hidden;">
                <div id="mat-preview-filename" style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">dateiname.pdf</div>
                <div class="mat-preview-meta" id="mat-preview-meta" style="font-size: 0.8rem; color: var(--text-secondary);">0 Seiten • 0 KB</div>
              </div>
            </div>
            <div class="mat-preview-snippet" id="mat-preview-snippet" style="display: none;"></div>
          </div>

          <div class="form-group" id="group-confirm-subject">
            <label id="lbl-confirm-subject">Schulfach *</label>
            <select id="mat-confirm-subject" class="input-field"></select>
            <div id="mat-fixed-subject-badge" style="display: none; font-size: 0.8rem; color: var(--accent-light); margin-top: 4px; font-weight: 500;">🔒 Aus aktuellem Fach geöffnet (fest zugeordnet)</div>
          </div>
          <div class="form-group">
            <label>Thema (Lehrplan E)</label>
            <select id="mat-confirm-topic" class="input-field">
              <option value="">-- Kein spezifisches Thema --</option>
            </select>
          </div>
          <div class="form-group">
            <label>Titel des Materials *</label>
            <input type="text" id="mat-confirm-title" class="input-field" placeholder="z. B. Pflanzenzelle Übung">
          </div>
          <div class="form-group">
            <label>Dokumentenart</label>
            <select id="mat-confirm-kind" class="input-field">
              <option value="Arbeitsblatt">Arbeitsblatt</option>
              <option value="Mitschrift">Mitschrift (handschriftlich)</option>
              <option value="Buch">Schulbuch / Arbeitsheft</option>
              <option value="Buchauszug">Buchauszug (Kapitel / Seiten)</option>
              <option value="Test">Test / Diktat / bewertete Leistung</option>
              <option value="Klassenarbeit">Klassenarbeit / Klausur</option>
              <option value="Vokabelliste">Vokabelliste</option>
              <option value="Sonstiges">Sonstiges</option>
              <option value="Stundenplan">Stundenplan</option>
            </select>
          </div>
          <div class="form-group">
            <label>Notiz / Zusammenfassung (optional)</label>
            <input type="text" id="mat-confirm-summary" class="input-field" placeholder="z. B. Für Klassenarbeit am 24.10.">
          </div>

          <div class="modal-actions-row" style="display: flex; gap: 12px; margin-top: 20px;">
            <button type="button" id="btn-back-material-step" class="btn-secondary-sm" style="flex: 1;">Zurück</button>
            <button type="button" id="btn-submit-material" class="btn-primary" style="flex: 2;">Bestätigen & Speichern</button>
          </div>
        </div>
      </div>
    </div>
  </div>
