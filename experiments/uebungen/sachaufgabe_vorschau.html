<title>Dreisatz-Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Steuerleiste oben, darunter Tafel (Theas Sicht) links und Elternansicht rechts; schmal untereinander. */
:root {
  --bg: #f3f4f8;
  --panel: #ffffff;
  --fg: #1c2030;
  --muted: #5d6478;
  --line: #dde0ea;
  --accent: #5457d6;
  --accent-soft: #e7e7fb;
  --ok: #1f8a5b;
  --warn: #b5650d;
  --font-ui: "Lexend", -apple-system, "Segoe UI", sans-serif;
  --font-hand: "Caveat", "Bradley Hand", "Comic Sans MS", cursive;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  /* Tafel: wie in der App (dunkel mit Mathe-Gitter) oder weißes Blatt */
  --board-bg: #121620;
  --board-grid: rgba(255, 255, 255, 0.055);
  --board-ink: #e8eaf2;
  --board-faint: rgba(232, 234, 242, 0.45);
  --board-line: rgba(232, 234, 242, 0.35);
  --luna: #f2b84b;
  --zone: rgba(99, 102, 241, 0.75);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131a; --panel: #1a1d27; --fg: #e6e8f0; --muted: #9aa1b5; --line: #2c3040;
    --accent: #8f92ff; --accent-soft: #262a48; --ok: #4cc28d; --warn: #f0a24a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131a; --panel: #1a1d27; --fg: #e6e8f0; --muted: #9aa1b5; --line: #2c3040;
  --accent: #8f92ff; --accent-soft: #262a48; --ok: #4cc28d; --warn: #f0a24a; color-scheme: dark;
}
.board.white {
  --board-bg: #fbfbf7;
  --board-grid: rgba(70, 100, 170, 0.12);
  --board-ink: #1b2130;
  --board-faint: rgba(27, 33, 48, 0.45);
  --board-line: rgba(27, 33, 48, 0.35);
  --luna: #b45a09;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1480px; margin: 0 auto; display: grid; gap: 16px; }
header h1 { font-size: 22px; margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }

/* Steuerleiste */
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.chip {
  font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.chip small { font-size: 11px; opacity: .8; }
.anti-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: inline-block; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .main { grid-template-columns: minmax(0, 1fr); } }

/* Tafel */
.board-scroll { overflow-x: auto; border-radius: 14px; }
.board {
  container-type: inline-size; min-width: 720px; min-height: 640px;
  background-color: var(--board-bg); color: var(--board-ink);
  background-image:
    linear-gradient(var(--board-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--board-grid) 1px, transparent 1px);
  background-size: 2.2cqw 2.2cqw;
  border-radius: 14px; padding: 2.4cqw 3.2cqw 6cqw; font-size: 1.75cqw; line-height: 1.5;
  display: grid; gap: 2.2cqw; align-content: start;
}
.src { font-size: 1.15cqw; color: var(--board-faint); letter-spacing: .04em; }
.task { font-size: 1.95cqw; max-width: 62ch; }
.zone { position: relative; display: grid; gap: .8cqw; padding: .6cqw .8cqw; border-radius: 10px; border: 2px dashed transparent; }
.show-zones .zone { border-color: var(--zone); }
.zone-tag {
  display: none; position: absolute; top: -1.1cqw; right: 1cqw; font-size: 1cqw; font-family: var(--font-ui);
  background: var(--zone); color: #fff; padding: .1cqw .7cqw; border-radius: 6px;
}
.show-zones .zone-tag { display: block; }
.label { font-weight: 700; }
.writeline { display: flex; gap: .8cqw; align-items: baseline; flex-wrap: wrap; }
.blank { display: inline-block; min-width: 9cqw; border-bottom: 2px solid var(--board-line); height: 1.6em; vertical-align: bottom; position: relative; }
.blank.long { flex: 1; min-width: 30cqw; }
.luna { font-family: var(--font-hand); color: var(--luna); font-size: 2.5cqw; line-height: 1; font-weight: 700; }
.blank .luna { position: absolute; left: .4cqw; bottom: .1cqw; white-space: nowrap; }
.blank.long { height: auto; min-height: 1.6em; }
.blank.long .luna { position: static; white-space: normal; display: block; padding: 0 .4cqw .2cqw; }
.empty-space { min-height: 7cqw; }

/* Dreisatz-Tabelle */
.ds { display: grid; grid-template-columns: 7cqw 15cqw 15cqw 7cqw; align-items: center; justify-content: start; row-gap: .3cqw; font-family: var(--font-num); font-size: 1.8cqw; }
.ds .head { font-family: var(--font-ui); font-size: 1.45cqw; text-align: center; border-bottom: 2px solid var(--board-line); padding-bottom: .4cqw; }
.ds .val { text-align: center; height: 3.6cqw; display: flex; align-items: center; justify-content: center; border-right: 2px solid var(--board-line); }
.ds .val.r { border-right: 0; border-left: 0; }
.ds .val.l { border-right: 2px solid var(--board-line); }
.ds .cellblank { width: 70%; border-bottom: 2px solid var(--board-line); height: 2.4cqw; position: relative; }
.ds .cellblank .luna { position: absolute; inset: auto 0 .2cqw; text-align: center; }
.ds .op { height: 3.6cqw; display: flex; align-items: center; justify-content: center; gap: .3cqw; color: var(--board-faint); }
.ds .opbox { width: 4.6cqw; height: 2.7cqw; border: 2px solid var(--board-line); border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; }
.ds .arrow { font-family: var(--font-ui); }
.ds .opspace { height: 3.6cqw; }

/* Lunas Leiste unter der Tafel */
.leftcol { display: grid; gap: 12px; min-width: 0; }
.lunabar { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 12px; }
.step { display: grid; gap: 8px; }
.step-label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.say { display: flex; gap: 10px; align-items: flex-start; }
.say .who { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.say p { margin: 0; font-size: 16px; padding-top: 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 40px; }
.opt { font: inherit; font-size: 16px; min-width: 110px; padding: 10px 18px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.sim { font-size: 14px; }
.verdict { margin-left: 40px; font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.verdict.caught { border-color: var(--ok); }
.verdict.missed { border-color: var(--warn); }

/* Elternansicht */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0; }
.panel h3 { font-size: 14px; margin: 0 0 4px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 10px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; }
.pill.ok { color: var(--ok); }
.pill.warn { color: var(--warn); }
.soltable { border-collapse: collapse; font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; }
.soltable td, .soltable th { padding: 3px 10px; border-bottom: 1px solid var(--line); text-align: right; }
.soltable th { font-family: var(--font-ui); font-weight: 700; color: var(--muted); font-size: 12px; }
.soltable td.op { color: var(--muted); text-align: center; }
.help { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.help b { font-weight: 700; }
.list { margin: 0; padding-left: 18px; }
.note { color: var(--muted); font-size: 13px; }
.thea { border-left: 3px solid var(--warn); padding-left: 10px; }
@media (prefers-reduced-motion: no-preference) { .board .luna { animation: write .35s ease-out; } }
@keyframes write { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Dreisatz-Pilot · Sachaufgabe mit Lösungsweg</h1>
    <p>7 Aufgaben aus Theas Test, Matheprobe und Buch, je mit Zwilling. Alle Lösungen sind nachgerechnet. Links die Tafel, wie Thea sie sähe, darunter Lunas Schätzfrage, rechts die Ansicht für die Freigabe.</p>

  <div class="main">

    </div>
    <aside class="panel" id="panel" aria-label="Elternansicht"></aside>
  </div>
</div>

<script>
const DATA = JSON.parse(document.getElementById("daten").textContent.replace(/\/\*DATA\*\/|\/\*END\*\//g, ""));
const byId = Object.fromEntries(DATA.uebungen.map(u => [u.id, u]));
const originals = DATA.uebungen.filter(u => u.ableitung === "A");
const KURZ = {
  "sa-gummibaerchen": "Gummibärchen", "sa-apfelsaft-flaschen": "Saftflaschen", "sa-drucker": "Drucker",
  "sa-flugzeug": "Flugzeug", "sa-apfelmosterei": "Apfelmosterei", "sa-umzug": "Umzug", "sa-taxi": "Taxi",
};
const STUFEN = {
  1: "Tabelle vorgegeben, Antwort angefangen",
  2: "nur Tabellenkopf",
  3: "nur R: und A:",
  4: "leer wie im Test",
};

let state = { orig: originals[0].id, twin: false, stage: 1, solution: false, zones: false, white: false, guess: null, outcome: null };
try { Object.assign(state, JSON.parse(localStorage.getItem("dreisatz-pilot") || "{}")); } catch (e) {}
if (!byId[state.orig]) state.orig = originals[0].id;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmt(x, einheit) {
  const n = Number(x);
  if (einheit === "€") return n.toFixed(2).replace(".", ",");
  return String(n).replace(".", ",");
}
function current() {
  const o = byId[state.orig];
  if (!state.twin) return o;
  return DATA.uebungen.find(u => u.zwilling_von === o.id) || o;
}
const luna = (text, on) => on ? `<span class="luna">${esc(text)}</span>` : "";
const blank = (sol, long) => `<span class="blank${long ? " long" : ""}">${sol || ""}</span>`;
const zone = (name, inner) => `<div class="zone"><span class="zone-tag">${esc(name)}</span>${inner}</div>`;

function dreisatzTable(u, stage, sol) {
  const anti = u.schema === "dreisatz_antiproportional";
  const [g1, g2] = u.groessen;
  const head = g => esc(g.name) + (g.einheit ? ` (in ${esc(g.einheit)})` : "");
  const inv = op => (op[0] === ":" ? "·" : ":") + op.slice(1);
  const opL = u.schritte, opR = anti ? u.schritte.map(inv) : u.schritte;
  const ein2 = g2.einheit;
  let h = `<div class="ds"><div></div><div class="head">${head(g1)}</div><div class="head">${head(g2)}</div><div></div>`;
  u.zeilen.forEach(([x, y], i) => {
    const showX = stage === 1 && (i === 0 || i === u.zeilen.length - 1);
    const showY = stage === 1 && i === 0;
    const cell = (v, shown, unit) => shown ? esc(fmt(v, unit)) : `<span class="cellblank">${luna(fmt(v, unit), sol)}</span>`;
    h += `<div class="opspace"></div><div class="val l">${cell(x, showX, "")}</div><div class="val r">${cell(y, showY, ein2)}</div><div class="opspace"></div>`;
    if (i < u.schritte.length) {
      h += `<div class="op"><span class="opbox">${luna(opL[i], sol)}</span><span class="arrow">↓</span></div><div></div><div></div>`;
      h += `<div class="op"><span class="arrow">↓</span><span class="opbox">${luna(opR[i], sol)}</span></div>`;
    }
  });
  return h + "</div>";
}

function renderBoard() {
  const u = current(), s = state.stage, sol = state.solution;
  const board = document.getElementById("board");
  board.classList.toggle("white", state.white);
  board.classList.toggle("show-zones", state.zones);
  const q = u.quelle;
  const src = q.art === "Buch" ? `${q.material} · S. ${q.seite} · Nr. ${q.nummer}` : `${q.material} · Nr. ${q.nummer}`;
  let h = `<div class="src">${esc(src)}${u.ableitung === "B" ? " · ähnliche Aufgabe" : ""}</div>`;
  h += `<div class="task">${esc(u.aufgabentext)}</div>`;

  if (u.begruendung && u.begruendung.verlangt && s <= 3) {
    h += zone("Begründung", `<div class="writeline"><span class="label">Begründung:</span>${blank(luna(u.begruendung.erwartung, sol), true)}</div><div class="writeline">${blank("", true)}</div>`);
  }
  if (u.ueberschlag && u.ueberschlag.verlangt && s <= 2) {
    const pre = s === 1 ? `${esc(u.ueberschlag.ausdruck.split("=")[0])}= ` : "";
    const val = s === 1 ? u.ueberschlag.ausdruck.split("=")[1].trim() : u.ueberschlag.ausdruck;
    h += zone("Überschlag", `<div class="writeline"><span class="label">Überschlag:</span> ${pre}${blank(luna(val + "  → " + u.ueberschlag.folgerung, sol), true)}</div>`);
  }
  if (s <= 3) {
    let rech;
    if (u.schema === "rechnung") {
      if (s === 1) {
        const [a, b] = u.rechnung.ausdruck.split(":").map(t => t.trim());
        const [ua, ub] = u.rechnung.umformung.split(":").map(t => t.trim());
        rech = `<div class="writeline"><span class="label">R:</span> ${esc(a)} : ${esc(b)} = ${blank(luna(ua, sol))} : ${blank(luna(ub, sol))} = ${blank(luna(fmt(u.ergebnis.wert), sol))}</div>`;
      } else {
        rech = `<div class="writeline"><span class="label">R:</span>${blank(luna(`${u.rechnung.ausdruck} = ${u.rechnung.umformung} = ${fmt(u.ergebnis.wert)}`, sol), true)}</div>`;
      }
    } else if (s <= 2) {
      rech = `<div class="writeline"><span class="label">R:</span></div>${dreisatzTable(u, s, sol)}`;
    } else {
      rech = `<div class="writeline"><span class="label">R:</span></div>${sol ? dreisatzTable(u, 2, true) : `<div class="empty-space"></div><div class="empty-space"></div>`}`;
    }
    h += zone("Rechnung", rech);
    const anfang = s === 1 ? esc(u.antwort_anfang) + " " : "";
    const rest = s === 1 ? u.antwortsatz.slice(u.antwort_anfang.length).trim() : u.antwortsatz;
    h += zone("Antwortsatz", `<div class="writeline"><span class="label">A:</span> ${anfang}${blank(luna(rest, sol), true)}</div>`);
  } else if (sol) {
    h += zone("Rechnung", u.schema === "rechnung"
      ? `<div class="writeline">${luna(`R: ${u.rechnung.ausdruck} = ${u.rechnung.umformung} = ${fmt(u.ergebnis.wert)}`, true)}</div>`
      : dreisatzTable(u, 2, true));
    h += zone("Antwortsatz", `<div class="writeline">${luna("A: " + u.antwortsatz, true)}</div>`);
  }
  h += `<div class="empty-space"></div>`;
  board.innerHTML = h;
}

function renderPanel() {
  const u = current(), g = u.ergebnis.einheit;
  const q = u.quelle;
  const fr = u.freigabe.noetig
    ? `<span class="pill warn">Freigabe nötig</span> <span class="note">${esc(u.freigabe.grund)}</span>`
    : `<span class="pill ok">ohne Freigabe</span> <span class="note">${esc(u.freigabe.grund)}</span>`;
  let sol = "";
  if (u.schema === "rechnung") {
    sol = `<p style="margin:0;font-family:var(--font-num)">${esc(u.rechnung.ausdruck)} = ${esc(u.rechnung.umformung)} = ${esc(fmt(u.ergebnis.wert))}</p>`;
  } else {
    const anti = u.schema === "dreisatz_antiproportional";
    const inv = op => (op[0] === ":" ? "·" : ":") + op.slice(1);
    const [g1, g2] = u.groessen;
    sol = `<table class="soltable"><tr><th></th><th>${esc(g1.name)}${g1.einheit ? " (" + esc(g1.einheit) + ")" : ""}</th><th>${esc(g2.name)}${g2.einheit ? " (" + esc(g2.einheit) + ")" : ""}</th><th></th></tr>`;
    u.zeilen.forEach(([x, y], i) => {
      const l = i > 0 ? u.schritte[i - 1] : "", r = i > 0 ? (anti ? inv(u.schritte[i - 1]) : u.schritte[i - 1]) : "";
      sol += `<tr><td class="op">${esc(l)}</td><td>${esc(fmt(x))}</td><td>${esc(fmt(y, g2.einheit))}</td><td class="op">${esc(r)}</td></tr>`;
    });
    sol += `</table>`;
  }
  const look = u.nachschlagen ? `${esc(u.nachschlagen.material)}, S. ${u.nachschlagen.seite}, ${esc(u.nachschlagen.stelle)}` : `<span class="note">keine Stelle in Theas Büchern (Stoff Klasse 6)</span>`;
  const twinOf = u.zwilling_von ? `<dt>Zwilling von</dt><dd>${esc(KURZ[u.zwilling_von] || u.zwilling_von)} (Original)</dd>` : "";
  document.getElementById("panel").innerHTML = `
    <h2>Für die Eltern</h2>
    <dl class="kv">
      <dt>Quelle</dt><dd>${esc(q.material)}${q.seite ? ", S. " + q.seite : ""}, Nr. ${esc(q.nummer)}${q.wortlaut_aus ? `<br><span class="note">Wortlaut: ${esc(q.wortlaut_aus)}</span>` : ""}</dd>
      <dt>Ableitung</dt><dd>${u.ableitung === "A" ? "A · Original" : "B · Zwilling"}</dd>
      ${twinOf}
      <dt>Abschnitt</dt><dd>${esc(u.abschnitt)}</dd>
      <dt>Freigabe</dt><dd>${fr}</dd>
    </dl>
    ${u.theas_loesung ? `<div class="thea"><h3>Theas Lösung damals</h3><p style="margin:0">${esc(u.theas_loesung)}</p></div>` : ""}
    <div><h3>Lösung (nachgerechnet)</h3>${sol}</div>
    <div><h3>Antwortsatz</h3><p style="margin:0">${esc(u.antwortsatz)}</p></div>
    ${u.ueberschlag ? `<div><h3>Überschlag</h3><p style="margin:0">${esc(u.ueberschlag.ausdruck)} → ${esc(u.ueberschlag.folgerung)}</p></div>` : ""}
    ${u.begruendung ? `<div><h3>Erwartete Begründung</h3><p style="margin:0">${esc(u.begruendung.erwartung)}</p></div>` : ""}
    <div><h3>Schätzfrage vor dem Rechnen</h3><p style="margin:0">${u.schaetzfrage.aktiv
      ? `${esc(u.schaetzfrage.frage)} → <b>${esc(u.schaetzfrage.antwort)}</b>`
      : `entfällt, der Überschlag auf der Tafel übernimmt`}</p></div>
    <div><h3>Fehlerbeispiel</h3><p style="margin:0">${esc(fmt(u.fehlerbeispiel.wert, g))} ${esc(g)}: ${esc(u.fehlerbeispiel.fehler)}.
      ${catches(u) ? `<span class="pill ok">${u.schaetzfrage.aktiv ? "fängt die Schätzfrage" : "fängt der Überschlag"}</span>` : `<span class="pill warn">fängt nur das Programm</span>`}</p></div>
    <div><h3>Typische Fehler</h3><ul class="list">${u.typische_fehler.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>
    <div><h3>Hilfe-Stufen</h3><ol class="help">
      <li><b>Denkanstoß:</b> ${esc(u.hilfen.denkanstoss)}</li>
      <li><b>Nachschlagen:</b> ${look}</li>
      <li><b>Hinweis:</b> ${esc(u.hilfen.hinweis)}</li>
      <li><b>Lösungsweg:</b> Luna schreibt den Weg auf die Tafel (Schalter „Lösung“), danach folgt ein Zwilling.</li>
    </ol></div>`;
}

// Schätzfrage: „mehr/länger“ heißt, das Ergebnis liegt über dem Vergleichswert
const isUp = opt => opt === "mehr" || opt === "länger";
const catches = u => (u.fehlerbeispiel.wert > u.schaetzfrage.vergleichswert) !== isUp(u.schaetzfrage.antwort);

function renderLuna() {
  const u = current(), sf = u.schaetzfrage, e = u.ergebnis.einheit;
  const ref = `${fmt(sf.vergleichswert, e)} ${e}`;
  const say = t => `<div class="say"><span class="who" aria-hidden="true">L</span><p>${esc(t)}</p></div>`;
  let h = `<div class="step"><span class="step-label">Vor dem Rechnen</span>`;
  if (u.einstieg && !state.twin) h += say(u.einstieg);
  if (!sf.aktiv) {
    h += say("Fang mit dem Überschlag an: Wie viele Flaschen wären es ungefähr?");
    h += `<p class="verdict">Keine Schätzfrage: ${esc(sf.grund)}</p></div>`;
    document.getElementById("lunabar").innerHTML = h;
    return;
  }
  h += say(sf.frage) + `<div class="opts">${sf.optionen.map(o =>
    `<button type="button" class="opt" data-opt="${esc(o)}" aria-pressed="${state.guess === o}">${esc(o)}</button>`).join("")}</div></div>`;

  if (state.guess) {
    const right = { wert: u.ergebnis.wert, label: "Thea rechnet richtig" };
    const wrong = { wert: u.fehlerbeispiel.wert, label: "Thea verrechnet sich" };
    h += `<div class="step"><span class="step-label">Nach dem Rechnen · zum Ausprobieren</span><div class="opts">
      <button type="button" class="opt sim" data-out="richtig" aria-pressed="${state.outcome === "richtig"}">${right.label} (${esc(fmt(right.wert, e))} ${esc(e)})</button>
      <button type="button" class="opt sim" data-out="fehler" aria-pressed="${state.outcome === "fehler"}">${wrong.label} (${esc(fmt(wrong.wert, e))} ${esc(e)})</button></div>`;
    if (state.outcome) {
      const r = state.outcome === "richtig" ? right.wert : wrong.wert;
      const res = `${fmt(r, e)} ${e}`;
      const fits = (r > sf.vergleichswert) === isUp(state.guess);
      if (state.outcome === "richtig" && fits) {
        h += say(`Passt zu deiner Schätzung: ${res} ist ${state.guess} als ${ref}.`);
      } else if (state.outcome === "richtig") {
        h += say(`Du hattest ${state.guess} als ${ref} geschätzt, herausgekommen sind ${res}. Dein Ergebnis stimmt. Überleg mal, warum es ${sf.antwort} sein muss.`);
        h += `<p class="verdict">Das Programm weiß, dass die Rechnung stimmt. Luna zweifelt deshalb die Schätzung an, nicht das Ergebnis.</p>`;
      } else if (!fits) {
        h += say(`Du hattest gesagt: ${state.guess} als ${ref}. Dein Ergebnis ist ${res}. Schau noch mal auf deine Rechnung.`);
        h += `<p class="verdict caught">Die Schätzfrage hat den Fehler aufgefangen. Thea findet ihn selbst.</p>`;
      } else {
        h += say(`Passt zu deiner Schätzung.`);
        h += `<p class="verdict missed">Diesen Fehler (${esc(u.fehlerbeispiel.fehler)}) fängt die Schätzfrage nicht. Das Programm prüft die Rechnung trotzdem und meldet ihn danach.</p>`;
      }
    }
    h += `</div>`;
  }
  const bar = document.getElementById("lunabar");
  bar.innerHTML = h;
  bar.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => set({ guess: b.dataset.opt, outcome: null })));
  bar.querySelectorAll("[data-out]").forEach(b => b.addEventListener("click", () => set({ outcome: b.dataset.out })));
}

function chip(label, pressed, onclick, extra) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.innerHTML = label + (extra || "");
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.addEventListener("click", onclick);
  return b;
}
function renderControls() {
  const fill = (id, items) => {
    const g = document.getElementById(id);
    g.querySelectorAll(".chip").forEach(c => c.remove());
    items.forEach(i => g.appendChild(i));
  };
  fill("pick", originals.map(o => chip(esc(KURZ[o.id] || o.id), o.id === state.orig, () => set({ orig: o.id }),
    o.schema === "dreisatz_antiproportional" ? ` <span class="anti-dot" title="antiproportional"></span>` : "")));
  fill("variant", [chip("Original", !state.twin, () => set({ twin: false })), chip("Zwilling", state.twin, () => set({ twin: true }))]);
  fill("stage", [1, 2, 3, 4].map(n => {
    const c = chip(String(n), state.stage === n, () => set({ stage: n }));
    c.title = STUFEN[n];
    return c;
  }));
  fill("toggles", [
    chip("Lösung", state.solution, () => set({ solution: !state.solution })),
    chip("Zonen", state.zones, () => set({ zones: !state.zones })),
    chip("Weißes Blatt", state.white, () => set({ white: !state.white })),
  ]);
}
function set(patch) {
  if ("orig" in patch || "twin" in patch) Object.assign(patch, { guess: null, outcome: null });
  Object.assign(state, patch);
  try { localStorage.setItem("dreisatz-pilot", JSON.stringify(state)); } catch (e) {}
  render();
}
function render() { renderControls(); renderBoard(); renderLuna(); renderPanel(); }
render();
</script>
